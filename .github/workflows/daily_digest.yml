name: Daily AI News Aggregator Digest

on:
  push:
    branches: [ "deployment" ]
  schedule:
    # Runs at 08:00 UTC (13:30 IST) every day
    - cron: '0 8 * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions tab

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync

      - name: Create Database Tables
        run: |
          uv run python app/database/create_tables.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Run Aggregator Pipeline
        run: |
          uv run python main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_BASE_URL: ${{ secrets.GEMINI_BASE_URL || 'https://generativelanguage.googleapis.com/v1beta/openai/' }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          MY_EMAIL: ${{ secrets.MY_EMAIL }}
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
